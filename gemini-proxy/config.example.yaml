# CLIProxyAPI v8 configuration template.
# Copy to ~/.config/cliproxyapi/config.yaml and fill in local secrets.
# Never commit the real config, OAuth files, kv.db, or logs.
config-version: 8

server:
  host: "127.0.0.1"
  port: 8317

management:
  # Management API is loopback-only. Set a secret key before using it.
  allow-remote: false
  secret-key: ""

access:
  # Local Pi/clients send this key as "Authorization: Bearer ...".
  api-keys: []

requests:
  # Optional outbound proxy for Google OAuth/API requests.
  proxy-url: ""

oauth:
  # OAuth credential storage; keep this directory private.
  auth-dir: "~/.cli-proxy-api"
  providers:
    antigravity:
      # Pi 1.5.2: these two fixed system-prompt phrases can trigger upstream
      # 429 RESOURCE_EXHAUSTED despite available quota. Reword only these
      # exact phrases; keep user messages, tools, and permission rules intact.
      sensitive-words-replace:
        "You are a coding assistant running inside pi, a coding agent harness.": "Assist with software development using the tools provided by Pi."
        "codemode scripts and non-LLM models such as classifiers and image models (docs/codemode.md)": "codemode usage, classification, and image generation (docs/codemode.md)"
