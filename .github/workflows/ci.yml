name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
        pi: ["1.4.0", "1.5.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            codegraph/package-lock.json
            search/package-lock.json
            helper/package-lock.json
      - name: Install native navigation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep fd-find
      - name: Install codegraph dependencies
        working-directory: codegraph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install search dependencies
        working-directory: search
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Helper dependencies
        working-directory: helper
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Select Pi host version for all extensions
        run: |
          npm --prefix codegraph install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@${{ matrix.pi }}
          npm --prefix search install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@${{ matrix.pi }} @earendil-works/pi-tui@${{ matrix.pi }}
          npm --prefix helper install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @earendil-works/pi-ai@${{ matrix.pi }} @earendil-works/pi-coding-agent@${{ matrix.pi }}
      - name: Typecheck and test
        env:
          PI_OFFLINE: "1"
        run: npm run check && npm test
      - name: Check isolated extension loading
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-extension-load
          PI_OFFLINE: "1"
          PI_TELEMETRY: "0"
        run: |
          for package in codegraph search helper; do
            entry=src/index.ts
            if [ "$package" = helper ]; then entry=extensions/index.ts; fi
            output=$(node "$package/node_modules/@earendil-works/pi-coding-agent/dist/cli.js" --offline --no-extensions -e "$PWD/$package/$entry" --list-models __compat_load__ 2>&1)
            printf '%s\n' "$output"
            if [[ "$output" == *"Failed to load extension"* || "$output" == *"Extension errors"* ]]; then exit 1; fi
          done
      - name: Check Helper formatting
        run: npm --prefix helper run check:format

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pi: ["1.4.0", "1.5.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: codegraph/package-lock.json
      - name: Install CodeGraph CLI
        run: npm install -g @colbymchenry/codegraph@1.6.2
      - name: Install extension dependencies
        working-directory: codegraph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Select Pi host version
        working-directory: codegraph
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@${{ matrix.pi }}
      - name: Run real Pi and CodeGraph smoke test
        working-directory: codegraph
        run: npm run smoke
