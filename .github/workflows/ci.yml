name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
        pi: ["1.3.0", "1.4.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            codegraph/package-lock.json
            search/package-lock.json
            helper/package-lock.json
      - name: Install codegraph dependencies
        working-directory: codegraph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install search dependencies
        working-directory: search
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Helper dependencies
        working-directory: helper
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Select Helper host version
        working-directory: helper
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @earendil-works/pi-ai@${{ matrix.pi }} @earendil-works/pi-coding-agent@${{ matrix.pi }}
      - name: Typecheck and test
        run: npm run check && npm test
      - name: Check Helper formatting
        run: npm --prefix helper run check:format

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: codegraph/package-lock.json
      - name: Install CodeGraph CLI
        run: npm install -g @colbymchenry/codegraph@1.6.2
      - name: Install extension dependencies
        working-directory: codegraph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run real Pi and CodeGraph smoke test
        working-directory: codegraph
        run: npm run smoke
